# Configurações do Banco de Dados apontando para o .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=${PORT:8080}

# Mapeia os nomes das tabelas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
app.documentos.upload-dir=${APP_DOCUMENTOS_UPLOAD_DIR:uploads/documentos}
app.upload.dir=${APP_UPLOAD_DIR:uploads/imagens}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5500}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.forward-headers-strategy=framework
app.frontend-url=${FRONTEND_URL:http://localhost:5500/pages}
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:1025}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:${MAIL_SMTP_AUTH:false}}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:${MAIL_SMTP_STARTTLS_ENABLE:false}}
