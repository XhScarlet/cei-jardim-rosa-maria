<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEI Jardim Rosa Maria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Pular para o conteúdo principal</a>
    <!--
      Clip path responsivo do shape principal.
      O path original do Figma tinha viewBox 1856x999; aqui todos os pontos
      foram divididos por largura/altura para funcionar com objectBoundingBox.
    -->
    <svg class="clip-defs" aria-hidden="true" focusable="false">
      <defs>
        <clipPath id="shape-bordas-internas" clipPathUnits="objectBoundingBox">
          <path
            d="M 0.636756 0 C 0.651094 0 0.662716 0.021593 0.662716 0.048228 C 0.662716 0.074864 0.674337 0.096457 0.688675 0.096457 H 0.951509 C 0.978292 0.096457 1 0.136792 1 0.186547 V 0.90991 C 1 0.959666 0.978292 1 0.951509 1 H 0.048491 C 0.02171 1 0 0.959666 0 0.90991 V 0.204204 C 0 0.154448 0.02171 0.114114 0.048491 0.114114 H 0.096444 C 0.113405 0.114114 0.127155 0.088569 0.127155 0.057057 C 0.127155 0.025545 0.140905 0 0.157866 0 H 0.636756 Z"
          />
        </clipPath>
      </defs>
    </svg>

    <main id="main-content" class="page" aria-label="Página inicial do CEI Jardim Rosa Maria">
      <!-- Camada de fundo exportada do Figma, com a mesma opacidade do layout. -->
      <img
        class="background-illustration"
        src="../assets/img-fundo-iii.png"
        alt=""
        aria-hidden="true"
      />

      <!-- Logo floral no canto superior esquerdo. -->
      <img class="brand-flower" src="../assets/rosa.svg" alt="" aria-hidden="true" />

      <!-- Menu fora do shape clipado para preservar visibilidade e área clicável. -->
      <nav class="nav-menu" aria-label="Navegação principal">
        <a class="nav-pill nav-pill-active" href="index.html" aria-current="page">INÍCIO</a>
        <a class="nav-pill" href="sobre.html">SOBRE</a>
        <a class="nav-pill" href="blog.html">BLOG</a>
        <a class="nav-pill" href="matricula.html">MATRÍCULA</a>
        <a class="nav-pill nav-pill-login" href="login.html">LOGIN</a>
      </nav>

      <!-- Conteúdo principal clipado pelo SVG definido acima. -->
      <section class="hero-shape">
        <div class="shape-content">
          <div class="hero-copy">
            <p class="eyebrow">CEI</p>
            <h1>Jardim<br />Rosa Maria</h1>
            <span class="title-line" aria-hidden="true"></span>

            <p class="hero-description">
              <strong>Educação infantil com <span>carinho</span>,</strong>
              <strong><span>acolhimento</span> e</strong>
              <strong><span>desenvolvimento</span>.</strong>
            </p>

            <div class="hero-actions">
              <a class="primary-button" href="sobre.html">CONHEÇA O NOSSO CEI</a>
              <a
                class="location-button"
                href="https://share.google/2yIlmUci0ZXsGGEFe"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Ver localização no Google Maps"
              >
                <img src="../assets/botao-localizaçao.svg" alt="" aria-hidden="true" />
              </a>
            </div>
          </div>

          <!-- Imagem principal posicionada conforme o frame do Figma. -->
          <img class="school-image" src="../assets/img-CEI.svg" alt="Fachada ilustrada do CEI" />

          <!-- Flor azul na base do shape. -->
          <img class="blue-flower" src="../assets/rosa-azul.svg" alt="" aria-hidden="true" />
        </div>
      </section>
    </main>
  </body>
</html>
