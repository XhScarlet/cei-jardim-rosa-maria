# Configurações do Banco de Dados apontando para o .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=${PORT:8080}

# Mapeia os nomes das tabelas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
app.documentos.upload-dir=uploads/documentos
app.upload.dir=uploads/imagens
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5500}
